<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- SEO -->
<title>Overlay Compare</title>
<meta name="description" content="두 이미지를 오버레이로 비교할 수 있는 도구입니다. 슬라이더를 움직여 전후 차이를 한눈에 확인하세요.">
<meta name="keywords" content="이미지 비교, 오버레이 비교, before after, 이미지 슬라이더">
<meta name="author" content="">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://yourdomain.com/">

<!-- Open Graph (카카오, 페이스북 등 SNS 공유) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Overlay Compare">
<meta property="og:description" content="두 이미지를 오버레이로 비교할 수 있는 도구입니다.">
<meta property="og:image" content="https://yourdomain.com/og-image.png">
<meta property="og:url" content="https://yourdomain.com/">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="Overlay Compare">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Overlay Compare">
<meta name="twitter:description" content="두 이미지를 오버레이로 비교할 수 있는 도구입니다.">
<meta name="twitter:image" content="https://yourdomain.com/og-image.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Pretendard:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0f;
    --surface: #18181a;
    --surface2: #222224;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.18);
    --text: #e8e8e6;
    --text-muted: #888884;
    --text-dim: #444442;
    --accent: #d4f53c;
    --accent-dim: rgba(212,245,60,0.12);
    --accent-text: #0e0e0f;
    --danger: #ff5f5f;
  }

  body {
    font-family: 'Pretendard', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 0.5px solid var(--border);
    flex-shrink: 0;
  }

  .logo {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.05em;
  }

  .header-hint {
    font-size: 12px;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
  }

  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 260px 1fr;
    overflow: hidden;
    height: calc(100vh - 49px);
  }

  .sidebar {
    border-right: 0.5px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 20px 16px;
    gap: 24px;
  }

  .sidebar-section { display: flex; flex-direction: column; gap: 8px; }

  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding-bottom: 4px;
    border-bottom: 0.5px solid var(--border);
    margin-bottom: 2px;
  }

  .drop-zone {
    border: 1px dashed var(--border-hover);
    border-radius: 8px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    min-height: 90px;
    justify-content: center;
    position: relative;
  }

  .drop-zone:hover { border-color: var(--accent); background: var(--accent-dim); }
  .drop-zone.drag-over { border-color: var(--accent); background: var(--accent-dim); }
  .drop-zone.has-image { border-style: solid; border-color: var(--border-hover); }
  .drop-zone.has-image:hover { border-color: var(--accent); }

  .drop-zone input[type=file] { display: none; }

  .drop-icon {
    width: 20px; height: 20px;
    stroke: var(--text-muted);
    fill: none;
    stroke-width: 1.5;
    flex-shrink: 0;
  }

  .drop-label { font-size: 12px; color: var(--text-muted); text-align: center; }
  .drop-sub { font-size: 11px; color: var(--text-dim); font-family: 'DM Mono', monospace; }

  .thumb-wrap {
    display: none;
    width: 100%;
    position: relative;
  }

  .thumb-wrap img {
    width: 100%;
    height: 64px;
    object-fit: cover;
    border-radius: 4px;
    display: block;
  }

  .thumb-name {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    font-family: 'DM Mono', monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .clear-btn {
    position: absolute;
    top: -6px; right: -6px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--danger);
    border: none;
    color: white;
    font-size: 11px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }

  .slot-label {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    margin-bottom: 2px;
  }

  .divider { height: 0.5px; background: var(--border); }

  .control-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .control-name {
    font-size: 12px;
    color: var(--text-muted);
    min-width: 52px;
    flex-shrink: 0;
  }

  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 3px;
    background: var(--surface2);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }

  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }

  .val-badge {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    min-width: 32px;
    text-align: right;
  }

  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .btn-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

  .btn {
    padding: 8px 0;
    border: 0.5px solid var(--border-hover);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text-muted);
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    transition: all 0.12s;
    text-align: center;
  }

  .btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .btn.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
    font-weight: 500;
  }

  .btn-full {
    width: 100%;
    padding: 9px;
    border: 0.5px solid var(--border-hover);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text-muted);
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    transition: all 0.12s;
    text-align: center;
  }

  .btn-full:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .blend-select {
    width: 100%;
    padding: 7px 10px;
    background: var(--surface);
    border: 0.5px solid var(--border-hover);
    border-radius: 6px;
    color: var(--text);
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }

  .blend-select:focus { border-color: var(--accent); }

  .select-wrap { position: relative; }
  .select-arrow {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    pointer-events: none; color: var(--text-dim); font-size: 10px;
  }

  .canvas-area {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 32px;
    background: #0a0a0b;
    position: relative;
  }

  .canvas-area.grid-bg {
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 24px 24px;
    background-color: #0a0a0b;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    pointer-events: none;
  }

  .empty-icon {
    width: 48px; height: 48px;
    stroke: var(--text-dim);
    fill: none;
    stroke-width: 1;
    opacity: 0.4;
  }

  .empty-state p { font-family: 'DM Mono', monospace; font-size: 11px; line-height: 1.7; }

  #img-container {
    display: none;
    position: relative;
    box-shadow: 0 0 0 1px var(--border);
    border-radius: 4px;
    overflow: hidden;
    max-width: 100%;
    max-height: calc(100vh - 160px);
  }

  #base-img {
    display: block;
    max-width: calc(100vw - 340px);
    max-height: calc(100vh - 160px);
    object-fit: contain;
  }

  #overlay-img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
    transition: opacity 0.05s;
  }

  .img-badge {
    position: absolute;
    bottom: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 3px;
    letter-spacing: 0.05em;
  }

  .badge-left { left: 10px; background: rgba(0,0,0,0.65); color: #aaa; }
  .badge-right { right: 10px; background: rgba(212,245,60,0.2); color: var(--accent); }

  .zoom-controls {
    position: absolute;
    bottom: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .zoom-btn {
    width: 28px; height: 28px;
    border: 0.5px solid var(--border-hover);
    border-radius: 5px;
    background: rgba(14,14,15,0.85);
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.12s;
    backdrop-filter: blur(4px);
  }

  .zoom-btn:hover { color: var(--accent); border-color: var(--accent); }

  .zoom-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    text-align: center;
    padding: 3px 0;
  }

  .shortcut-hint {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    text-align: center;
    line-height: 1.8;
  }

  kbd {
    display: inline-block;
    padding: 1px 4px;
    border: 0.5px solid var(--border-hover);
    border-radius: 3px;
    font-size: 10px;
    background: var(--surface2);
    color: var(--text-muted);
  }
</style>
</head>
<body>

<header>
  <span class="logo">// overlay-compare</span>
  <span class="header-hint">디자인 ↔ 마크업 오버레이 비교 도구</span>
</header>

<div class="main">
  <div class="sidebar">

    <div class="sidebar-section">
      <div class="section-label">이미지</div>

      <div class="slot-label">베이스 (디자인 시안)</div>
      <div class="drop-zone" id="drop-base" onclick="document.getElementById('in-base').click()">
        <input type="file" id="in-base" accept="image/*">
        <svg class="drop-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>
        <span class="drop-label">클릭 또는 드래그</span>
        <div class="thumb-wrap" id="tw-base">
          <button class="clear-btn" onclick="clearSlot(event,'base')">×</button>
          <img id="thumb-base" src="" alt="">
          <div class="thumb-name" id="name-base"></div>
        </div>
      </div>

      <div class="slot-label">오버레이 (마크업 결과물)</div>
      <div class="drop-zone" id="drop-over" onclick="document.getElementById('in-over').click()">
        <input type="file" id="in-over" accept="image/*">
        <svg class="drop-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>
        <span class="drop-label">클릭 또는 드래그</span>
        <div class="thumb-wrap" id="tw-over">
          <button class="clear-btn" onclick="clearSlot(event,'over')">×</button>
          <img id="thumb-over" src="" alt="">
          <div class="thumb-name" id="name-over"></div>
        </div>
      </div>

      <button class="btn-full" onclick="swapImages()">↕ 이미지 교체</button>
    </div>

    <div class="divider"></div>

    <div class="sidebar-section">
      <div class="section-label">투명도</div>
      <div class="control-row">
        <span class="control-name">오버레이</span>
        <input type="range" min="0" max="100" value="50" step="1" id="sl-opacity">
        <span class="val-badge" id="val-opacity">50%</span>
      </div>
      <div class="btn-grid-3">
        <button class="btn" onclick="quickOpacity(0)">0%</button>
        <button class="btn" onclick="quickOpacity(50)">50%</button>
        <button class="btn" onclick="quickOpacity(100)">100%</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="sidebar-section">
      <div class="section-label">블렌드 모드</div>
      <div class="select-wrap">
        <select class="blend-select" id="blend-select" onchange="applyBlend()">
          <option value="normal">normal</option>
          <option value="difference">difference</option>
          <option value="exclusion">exclusion</option>
          <option value="multiply">multiply</option>
          <option value="screen">screen</option>
          <option value="overlay">overlay</option>
          <option value="hard-light">hard-light</option>
          <option value="color-dodge">color-dodge</option>
        </select>
        <span class="select-arrow">▾</span>
      </div>
      <button class="btn-full" id="btn-diff" onclick="toggleDiff()">차이 강조 (difference)</button>
    </div>

    <div class="divider"></div>

    <div class="sidebar-section">
      <div class="section-label">줌</div>
      <div class="control-row">
        <span class="control-name">배율</span>
        <input type="range" min="25" max="300" value="100" step="5" id="sl-zoom">
        <span class="val-badge" id="val-zoom">100%</span>
      </div>
      <div class="btn-grid">
        <button class="btn" onclick="setZoom(50)">50%</button>
        <button class="btn" onclick="setZoom(100)">100%</button>
        <button class="btn" onclick="setZoom(150)">150%</button>
        <button class="btn" onclick="setZoom(200)">200%</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="sidebar-section">
      <div class="section-label">단축키</div>
      <div class="shortcut-hint">
        <kbd>←</kbd><kbd>→</kbd> 투명도 조절<br>
        <kbd>D</kbd> 차이 강조<br>
        <kbd>S</kbd> 이미지 교체<br>
        <kbd>0</kbd> <kbd>5</kbd> <kbd>9</kbd> 빠른 투명도
      </div>
    </div>

  </div>

  <div class="canvas-area grid-bg" id="canvas-area">
    <div class="empty-state" id="empty-state">
      <svg class="empty-icon" viewBox="0 0 48 48">
        <rect x="6" y="6" width="20" height="20" rx="2"/>
        <rect x="22" y="22" width="20" height="20" rx="2"/>
        <path d="M14 14l20 20" stroke-dasharray="3 3"/>
      </svg>
      <p>디자인 시안과 마크업 결과물<br>두 이미지를 올려주세요</p>
    </div>

    <div id="img-container">
      <img id="base-img" src="" alt="디자인 시안">
      <img id="overlay-img" src="" alt="마크업 결과물">
      <span class="img-badge badge-left" id="badge-base">BASE</span>
      <span class="img-badge badge-right" id="badge-over-label" style="display:none;">OVERLAY</span>
    </div>
  </div>
</div>

<script>
let baseURL = null, overURL = null, diffActive = false;
let zoom = 100;

const slOpacity = document.getElementById('sl-opacity');
const valOpacity = document.getElementById('val-opacity');
const slZoom = document.getElementById('sl-zoom');
const valZoom = document.getElementById('val-zoom');
const overlayImg = document.getElementById('overlay-img');
const blendSel = document.getElementById('blend-select');
const imgContainer = document.getElementById('img-container');
const emptyState = document.getElementById('empty-state');
const baseImg = document.getElementById('base-img');

slOpacity.addEventListener('input', () => {
  applyOpacity(slOpacity.value);
});

slZoom.addEventListener('input', () => {
  zoom = +slZoom.value;
  applyZoom();
});

function applyOpacity(v) {
  const n = Math.round(+v);
  overlayImg.style.opacity = n / 100;
  slOpacity.value = n;
  valOpacity.textContent = n + '%';
  document.getElementById('badge-over-label').style.display = n > 5 ? 'block' : 'none';
}

function quickOpacity(v) { applyOpacity(v); }

function applyBlend() {
  overlayImg.style.mixBlendMode = blendSel.value;
  const isDiff = blendSel.value === 'difference';
  document.getElementById('btn-diff').classList.toggle('active', isDiff);
  diffActive = isDiff;
}

function toggleDiff() {
  diffActive = !diffActive;
  blendSel.value = diffActive ? 'difference' : 'normal';
  overlayImg.style.mixBlendMode = blendSel.value;
  document.getElementById('btn-diff').classList.toggle('active', diffActive);
  if (diffActive) applyOpacity(100);
}

function applyZoom() {
  valZoom.textContent = zoom + '%';
  slZoom.value = zoom;
  baseImg.style.maxWidth = zoom === 100 ? 'calc(100vw - 340px)' : 'none';
  baseImg.style.maxHeight = zoom === 100 ? 'calc(100vh - 160px)' : 'none';
  baseImg.style.width = zoom !== 100 ? (baseImg.naturalWidth * zoom / 100) + 'px' : '';
}

function setZoom(v) { zoom = v; applyZoom(); }

function swapImages() {
  if (!baseURL || !overURL) return;
  [baseURL, overURL] = [overURL, baseURL];
  baseImg.src = baseURL;
  overlayImg.src = overURL;
  const tb = document.getElementById('thumb-base');
  const to = document.getElementById('thumb-over');
  const nb = document.getElementById('name-base');
  const no = document.getElementById('name-over');
  [tb.src, to.src] = [to.src, tb.src];
  [nb.textContent, no.textContent] = [no.textContent, nb.textContent];
}

function loadSlot(key, file) {
  const isBase = key === 'base';
  const reader = new FileReader();
  reader.onload = e => {
    const url = e.target.result;
    const tw = document.getElementById('tw-' + key);
    const thumb = document.getElementById('thumb-' + key);
    const nameEl = document.getElementById('name-' + key);
    const dropZone = document.getElementById('drop-' + key);
    const uploadIcon = dropZone.querySelector('.drop-icon');
    const uploadLabel = dropZone.querySelector('.drop-label');

    thumb.src = url;
    nameEl.textContent = file.name.length > 22 ? file.name.slice(0,20)+'…' : file.name;
    tw.style.display = 'block';
    if (uploadIcon) uploadIcon.style.display = 'none';
    if (uploadLabel) uploadLabel.style.display = 'none';
    dropZone.classList.add('has-image');

    if (isBase) { baseURL = url; baseImg.src = url; }
    else { overURL = url; overlayImg.src = url; }

    checkReady();
  };
  reader.readAsDataURL(file);
}

function clearSlot(e, key) {
  e.stopPropagation();
  const tw = document.getElementById('tw-' + key);
  const dropZone = document.getElementById('drop-' + key);
  const uploadIcon = dropZone.querySelector('.drop-icon');
  const uploadLabel = dropZone.querySelector('.drop-label');

  tw.style.display = 'none';
  if (uploadIcon) uploadIcon.style.display = '';
  if (uploadLabel) uploadLabel.style.display = '';
  dropZone.classList.remove('has-image');
  document.getElementById('in-' + key).value = '';

  if (key === 'base') { baseURL = null; baseImg.src = ''; }
  else { overURL = null; overlayImg.src = ''; }
  checkReady();
}

function checkReady() {
  const ready = baseURL && overURL;
  imgContainer.style.display = ready ? 'block' : 'none';
  emptyState.style.display = ready ? 'none' : 'flex';
  if (ready) applyOpacity(slOpacity.value);
}

['base','over'].forEach(key => {
  const input = document.getElementById('in-' + key);
  const zone = document.getElementById('drop-' + key);
  const isBase = key === 'base';

  input.addEventListener('change', e => {
    if (e.target.files[0]) loadSlot(key, e.target.files[0]);
  });

  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) loadSlot(key, f);
  });
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const cur = +slOpacity.value;
  if (e.key === 'ArrowLeft') applyOpacity(Math.max(0, cur - 5));
  if (e.key === 'ArrowRight') applyOpacity(Math.min(100, cur + 5));
  if (e.key === 'd' || e.key === 'D') toggleDiff();
  if (e.key === 's' || e.key === 'S') swapImages();
  if (e.key === '0') applyOpacity(0);
  if (e.key === '5') applyOpacity(50);
  if (e.key === '9') applyOpacity(100);
});
</script>
